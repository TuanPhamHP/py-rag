services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - '8000:8000'
    volumes:
      - chroma-data:/data/chroma
      - ./uploaded_files:/app/uploaded_files
    depends_on:
      - db
    env_file:
      - .env
    environment:
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_HOST=db
      - DB_PORT=5432
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: '0.5'
  db:
    image: postgres:15
    env_file:
      - .env
    environment:
      - POSTGRES_DB=chatbot_db
      - POSTGRES_USER=chatbot_user
      - POSTGRES_PASSWORD=root
    volumes:
      - pg-data:/var/lib/postgresql/data
    ports:
      - '5433:5432'
volumes:
  chroma-data:
  pg-data:
